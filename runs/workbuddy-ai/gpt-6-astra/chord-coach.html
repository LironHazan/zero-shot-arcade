function render(){const seventh=state.variation===3,theory=THEORY[state.scale],variation=VARIATIONS[state.variation],notes=voicing(state.degree,state.variation),fingers=variation[state.left?"lh":"rh"];chordButtons.forEach((button,degree)=>{/* Selectors name the triads; the active seventh symbol is shown above the piano. */button.querySelector(".symbol").textContent=chordLabel(degree,false);button.querySelector(".roman").textContent=theory.roman[degree];button.classList.toggle("selected",degree===state.degree);button.setAttribute("aria-pressed",String(degree===state.degree));button.setAttribute("aria-label",(degree+1)+": "+chordLabel(degree,false)+", "+theory.roman[degree]);});variationButtons.forEach((button,index)=>button.setAttribute("aria-pressed",String(index===state.variation)));$("shown-symbol").textContent=chordLabel(state.degree,seventh);$("shown-roman").textContent=theory[seventh?"roman7":"roman"][state.degree];$("formula").textContent=variation.roles.join(" – ");$("note-list").textContent=notes.map(noteWithOctave).join(" · ");$("hand").textContent=state.left?"LH":"RH";$("hand").setAttribute("aria-pressed",String(state.left));$("hand").setAttribute("aria-label",state.left?"Left hand; switch to right hand":"Right hand; switch to left hand");$("hand").title=(state.left?"Left":"Right")+" hand: "+fingers.join("–");$("names").setAttribute("aria-pressed",String(state.names));$("keyboard").classList.toggle("hide-names",!state.names);pianoKeys.forEach((button,index)=>{const midi=index+48,position=notes.indexOf(midi),root=position>=0&&mod(midi)===degreePC(state.degree);button.classList.toggle("tone",position>=0);button.classList.toggle("root-tone",root);button.querySelector(".note").textContent=namesByPC[mod(midi)];button.querySelector(".finger").textContent=position>=0?String(fingers[position]):"";const detail=noteWithOctave(midi)+(midi===60?", physical middle C":"")+(position>=0?", "+variation.roles[position]+", "+(state.left?"left":"right")+" finger "+fingers[position]:"");button.setAttribute("aria-label",detail);button.title=detail+" · computer key "+keyChars[index];});refreshLoopMarkers();}
function selectChord(degree){state.degree=degree;render();soundChord(degree,false);}
/* Visual timing is independent of audio availability, context state, and mute. */
const transport={running:false,started:false,origin:0,elapsed:0,cursor:0,timer:null,frame:null,visualBeat:null,current:null,next:null},beatDuration=()=>60000/state.bpm;function elapsedNow(){return transport.running?performance.now()-transport.origin:transport.elapsed;}
function setLoopGain(){if(!loopBus||!context)return;loopBus.gain.cancelScheduledValues(context.currentTime);loopBus.gain.setTargetAtTime(state.muted||!transport.running?0:1,context.currentTime,.006);}
function refreshLoopMarkers(){chordButtons.forEach((button,degree)=>{button.classList.toggle("current",transport.started&&transport.current===degree);button.classList.toggle("next",transport.started&&transport.next===degree);const flags=(transport.current===degree?", current loop chord":"")+(transport.next===degree?", next loop chord":"");button.title=chordLabel(degree,false)+flags;});$("next").textContent=transport.started&&transport.next!==null?"Next "+chordLabel(transport.next,state.variation===3):"";}
function schedule(){if(!transport.running)return;const now=performance.now(),duration=beatDuration();/* Skip stale events after a stall; never dump an audio backlog. */if(transport.origin+transport.cursor*duration<now-120)transport.cursor=Math.ceil((now-transport.origin)/duration);while(transport.origin+transport.cursor*duration<=now+90){const beat=transport.cursor++,time=transport.origin+beat*duration;if(context&&context.state==="running"&&!state.muted){const audioTime=context.currentTime+Math.max(.003,(time-now)/1000);if(beat<4)countClick(audioTime,beat===0);else if((beat-4)%4===0){const progression=currentProgression(),bar=Math.floor((beat-4)/4);soundChord(progression[bar%progression.length],true,audioTime);}}}}
function updateVisuals(){if(!transport.running)return;const elapsed=elapsedNow(),duration=beatDuration(),rawBeat=Math.floor(elapsed/duration),beat=Math.max(0,rawBeat),progression=currentProgression();if(rawBeat!==transport.visualBeat){transport.visualBeat=rawBeat;if(beat<4){transport.current=null;transport.next=progression[0];$("status").textContent="Count in · "+(beat+1)+" / 4";}else{const bar=Math.floor((beat-4)/4);transport.current=progression[bar%progression.length];transport.next=progression[(bar+1)%progression.length];/* Manual input remains audible; the next beat restores loop fingering. */state.degree=transport.current;$("status").textContent="Bar "+(bar+1)+" · beat "+((beat-4)%4+1);}render();document.querySelectorAll(".beats i").forEach((dot,index)=>dot.classList.toggle("active",rawBeat>=0&&index===beat%4));}const barFraction=elapsed<0?0:((elapsed/duration)%4)/4;$("progress-fill").style.transform="scaleX("+barFraction+")";transport.frame=requestAnimationFrame(updateVisuals);}
function invalidateLoopAudio(){clearLoopVoices();if(transport.running)transport.cursor=Math.max(0,Math.ceil(elapsedNow()/beatDuration()));}
function play(){if(transport.running){pause();return;}const fresh=!transport.started;if(fresh){transport.elapsed=-100;transport.started=true;transport.cursor=0;}transport.running=true;transport.origin=performance.now()-transport.elapsed;transport.cursor=Math.max(0,Math.ceil(transport.elapsed/beatDuration()));transport.visualBeat=null;setLoopGain();/* Resume mid-bar without inserting another count-in. */if(!fresh&&transport.elapsed>=4*beatDuration()&&transport.elapsed%beatDuration()>10){const progression=currentProgression(),bar=Math.floor((transport.elapsed/beatDuration()-4)/4);state.degree=progression[bar%progression.length];soundChord(state.degree,true);}$("play").textContent="Pause";$("play").setAttribute("aria-label","Pause practice");$("play").setAttribute("aria-pressed","true");schedule();transport.timer=setInterval(schedule,25);updateVisuals();}
function pause(){if(!transport.running)return;transport.elapsed=elapsedNow();transport.running=false;clearInterval(transport.timer);cancelAnimationFrame(transport.frame);clearLoopVoices();setLoopGain();$("play").textContent="Resume";$("play").setAttribute("aria-label","Resume practice");$("play").setAttribute("aria-pressed","false");$("status").textContent="Paused · press Play";}
function resetTransport(){const wasRunning=transport.running;if(wasRunning)pause();transport.started=false;transport.elapsed=0;transport.cursor=0;transport.current=null;transport.next=null;transport.visualBeat=null;$("play").textContent="Play";$("play").setAttribute("aria-label","Start practice");$("status").textContent="Ready · 4-beat count-in";$("progress-fill").style.transform="scaleX(0)";document.querySelectorAll(".beats i").forEach(dot=>dot.classList.remove("active"));refreshLoopMarkers();if(wasRunning)play();}
/* Each pointer and physical keyboard key is tracked independently. */
const heldPointers=new Map(),heldCodes=new Map();function refreshHeld(){const held=new Set([...heldPointers.values(),...heldCodes.values()]);pianoKeys.forEach((button,index)=>button.classList.toggle("down",held.has(index+48)));}function clearHeld(){heldPointers.clear();heldCodes.clear();refreshHeld();}function isEditable(target){return!!(target&&((typeof target.matches==="function"&&target.matches("input,select,textarea"))||target.isContentEditable));}
document.addEventListener("pointerdown",unlockAudio,{capture:true,passive:true});document.addEventListener("keydown",unlockAudio,{capture:true});document.addEventListener("keydown",event=>{if(isEditable(event.target)||event.ctrlKey||event.metaKey||event.altKey)return;if(event.code==="Space"){event.preventDefault();if(!event.repeat)play();return;}const digit=event.code.match(/^(?:Digit|Numpad)([1-7])$/);if(digit){event.preventDefault();if(!event.repeat)selectChord(Number(digit[1])-1);return;}const index=keyCodes.indexOf(event.code);if(index>=0){event.preventDefault();if(event.repeat||heldCodes.has(event.code))return;heldCodes.set(event.code,index+48);refreshHeld();pianoNote(index+48,context?context.currentTime+.006:0,false);}});document.addEventListener("keyup",event=>{heldCodes.delete(event.code);refreshHeld();});window.addEventListener("blur",clearHeld);document.addEventListener("visibilitychange",()=>{if(document.hidden){clearHeld();pause();}});
$("root").addEventListener("change",()=>{state.root=Number($("root").value);rebuildSpelling();resetTransport();render();});["major","minor"].forEach(kind=>$(kind).addEventListener("click",()=>{if(state.scale===kind)return;state.scale=kind;state.degree=0;state.preset=0;$("major").setAttribute("aria-pressed",String(kind==="major"));$("minor").setAttribute("aria-pressed",String(kind==="minor"));rebuildSpelling();renderRoots();renderPresets();resetTransport();render();}));$("hand").addEventListener("click",()=>{state.left=!state.left;render();});$("names").addEventListener("click",()=>{state.names=!state.names;render();});$("progression").addEventListener("change",()=>{state.preset=Number($("progression").value);resetTransport();render();});$("play").addEventListener("click",play);
$("mute").addEventListener("click",()=>{state.muted=!state.muted;$("mute").setAttribute("aria-pressed",String(state.muted));$("mute").textContent=state.muted?"Unmute loop":"Mute loop";/* Cancel already-scheduled loop notes, not the clock or manual voices. */invalidateLoopAudio();setLoopGain();});$("tempo").addEventListener("input",()=>{const beats=elapsedNow()/beatDuration();state.bpm=Math.max(40,Math.min(160,Number($("tempo").value)||80));$("bpm").textContent=state.bpm+" BPM";/* Preserve musical position across tempo changes. */transport.elapsed=beats*beatDuration();if(transport.running)transport.origin=performance.now()-transport.elapsed;invalidateLoopAudio();});
/* Initial load is visual ONLY: no audio context, media playback, network, or storage. */
buildUI();rebuildSpelling();renderRoots();renderPresets();render();
})();
